<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis favoritos — RoomFindsClub</title>
<meta name="description" content="Los productos que has guardado en RoomFindsClub para verlos más adelante.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://roomfindsclub.com/favoritos.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="section" style="padding-top:40px;">
  <div class="container">
    <div class="section-head">
      <div>
        <h2>Tus favoritos</h2>
        <p>Guardados en este navegador. Vuelve cuando quieras para verlos con calma.</p>
      </div>
    </div>
    <div class="product-grid" id="product-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <h3>Todavía no has guardado nada</h3>
      <p>Pulsa el corazón en cualquier producto del catálogo para añadirlo aquí.</p>
      <p style="margin-top:14px;"><a href="catalogo.html" class="btn btn-primary">Explorar catálogo</a></p>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader("favoritos");
  renderFooter();

  (async function init() {
    const products = await loadProducts();
    const favIds = getFavorites();
    const favProducts = products.filter((p) => favIds.includes(p.id));

    const grid = document.getElementById("product-grid");
    const empty = document.getElementById("empty-state");

    if (favProducts.length === 0) {
      grid.style.display = "none";
      empty.style.display = "block";
    } else {
      grid.innerHTML = favProducts.map(productCard).join("");
      bindFavButtons(grid);
      grid.addEventListener("click", (e) => {
        const favBtn = e.target.closest("[data-fav]");
        if (favBtn) {
          setTimeout(() => {
            if (!isFavorite(favBtn.getAttribute("data-fav"))) {
              favBtn.closest(".product-card").remove();
              if (!grid.children.length) {
                grid.style.display = "none";
                empty.style.display = "block";
              }
            }
          }, 50);
        }
      });
    }
  })();
</script>
</body>
</html>
