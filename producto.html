<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Producto — RoomFindsClub</title>
<meta id="page-desc" name="description" content="Ficha de producto en RoomFindsClub.">
<link rel="canonical" id="page-canonical" href="https://roomfindsclub.com/producto.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="RoomFindsClub">
<meta id="og-title" property="og:title" content="RoomFindsClub">
<meta id="og-desc" property="og:description" content="">
<meta id="og-image" property="og:image" content="">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="application/ld+json" id="ld-product">{}</script>
<script type="application/ld+json" id="ld-breadcrumb">{}</script>
</head>
<body>

<header class="site-header" id="site-header"></header>

<div class="container">
  <nav class="breadcrumbs" id="breadcrumbs" style="margin-top:24px;"></nav>
</div>

<section class="container product-detail" id="product-detail">
  <!-- se rellena por JS -->
</section>

<section class="section related" id="related-section" style="display:none;">
  <div class="container">
    <div class="section-head">
      <h2>También te puede interesar</h2>
    </div>
    <div class="product-grid" id="related-grid"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader("catalogo");
  renderFooter();

  (async function init() {
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const products = await loadProducts();
    const product = products.find((p) => p.id === id);
    const detailEl = document.getElementById("product-detail");

    if (!product) {
      detailEl.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <h3>Producto no encontrado</h3>
          <p>Puede que el enlace esté roto o el producto ya no esté disponible.</p>
          <p style="margin-top:14px;"><a href="catalogo.html" class="btn btn-outline">Volver al catálogo</a></p>
        </div>`;
      return;
    }

    const cat = getCategory(product.category);
    const fav = isFavorite(product.id);

    document.title = `${product.name} — RoomFindsClub`;
    document.getElementById("page-desc").setAttribute("content", product.description.slice(0, 155));
    document.getElementById("page-canonical").setAttribute("href", `https://roomfindsclub.com/producto.html?id=${product.id}`);
    document.getElementById("og-title").setAttribute("content", `${product.name} — RoomFindsClub`);
    document.getElementById("og-desc").setAttribute("content", product.description.slice(0, 155));
    document.getElementById("og-image").setAttribute("content", product.image);

    document.getElementById("breadcrumbs").innerHTML = `
      <a href="index.html">Inicio</a> / <a href="catalogo.html">Catálogo</a> / <a href="catalogo.html?cat=${cat.slug}">${cat.name}</a> / ${product.name}
    `;

    detailEl.innerHTML = `
      <div class="thumb-main">
        <img src="${product.image}" alt="${product.name}">
      </div>
      <div>
        <a class="cat-tag" href="catalogo.html?cat=${cat.slug}" style="text-decoration:none;">${cat.name}</a>
        <h1>${product.name}</h1>
        <p class="desc">${product.description}</p>
        <div class="actions">
          <a href="${product.affiliateLink}" target="_blank" rel="nofollow sponsored noopener" class="btn btn-primary">
            Ver en Amazon ${icon("external")}
          </a>
          <button class="btn btn-outline" id="fav-toggle" data-fav="${product.id}">
            ${icon("heart")} ${fav ? "Guardado en favoritos" : "Guardar en favoritos"}
          </button>
        </div>
        <p class="disclosure">Como afiliados de Amazon, RoomFindsClub obtiene una comisión por las compras que cumplen los requisitos aplicables, sin coste adicional para quien compra.</p>
      </div>
    `;

    const favBtn = document.getElementById("fav-toggle");
    favBtn.addEventListener("click", () => {
      const active = toggleFavorite(product.id);
      favBtn.innerHTML = `${icon("heart")} ${active ? "Guardado en favoritos" : "Guardar en favoritos"}`;
    });

    document.getElementById("ld-product").textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Product",
      "name": product.name,
      "description": product.description,
      "image": [product.image],
      "category": cat.name,
      "brand": { "@type": "Brand", "name": "RoomFindsClub" }
    });

    document.getElementById("ld-breadcrumb").textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Inicio", "item": "https://roomfindsclub.com/index.html" },
        { "@type": "ListItem", "position": 2, "name": "Catálogo", "item": "https://roomfindsclub.com/catalogo.html" },
        { "@type": "ListItem", "position": 3, "name": cat.name, "item": `https://roomfindsclub.com/catalogo.html?cat=${cat.slug}` },
        { "@type": "ListItem", "position": 4, "name": product.name, "item": `https://roomfindsclub.com/producto.html?id=${product.id}` }
      ]
    });

    const related = products.filter((p) => p.category === product.category && p.id !== product.id).slice(0, 4);
    if (related.length) {
      document.getElementById("related-section").style.display = "block";
      const grid = document.getElementById("related-grid");
      grid.innerHTML = related.map(productCard).join("");
      bindFavButtons(grid);
    }
  })();
</script>
</body>
</html>
