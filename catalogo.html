<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Catálogo — RoomFindsClub</title>
<meta id="page-desc" name="description" content="Explora el catálogo completo de RoomFindsClub: mesas, sillas, monitores, teclados, sonido, iluminación y accesorios para tu setup.">
<link rel="canonical" id="page-canonical" href="https://roomfindsclub.com/catalogo.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="RoomFindsClub">
<meta property="og:title" content="Catálogo — RoomFindsClub">
<meta property="og:description" content="Mesas, sillas, monitores, teclados, sonido, iluminación y accesorios para tu setup, organizados por categoría.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script type="application/ld+json" id="ld-itemlist">{}</script>
</head>
<body>

<header class="site-header" id="site-header"></header>

<section class="section" style="padding-top:40px;">
  <div class="container">
    <div class="section-head">
      <div>
        <h2 id="cat-heading">Catálogo completo</h2>
        <p id="cat-description">Todas las categorías del setup en un mismo sitio.</p>
      </div>
    </div>
    <div class="filters-bar" id="filters-bar"></div>
    <div class="product-grid" id="product-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <h3>Sin resultados todavía</h3>
      <p>Aún no hay productos en esta categoría. Vuelve pronto — el catálogo se actualiza constantemente.</p>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader("catalogo");
  renderFooter();

  const params = new URLSearchParams(location.search);
  const activeCat = params.get("cat");

  function renderFilters() {
    const bar = document.getElementById("filters-bar");
    const all = `<button class="chip ${!activeCat ? "active" : ""}" data-slug="">Todas</button>`;
    const chips = CATEGORIES.map(
      (c) => `<button class="chip ${activeCat === c.slug ? "active" : ""}" data-slug="${c.slug}">${c.name}</button>`
    ).join("");
    bar.innerHTML = all + chips;
    bar.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        const slug = btn.getAttribute("data-slug");
        location.href = slug ? `catalogo.html?cat=${slug}` : "catalogo.html";
      });
    });
  }

  function updateHeadMeta(cat) {
    const title = cat ? `${cat.name} — RoomFindsClub` : "Catálogo — RoomFindsClub";
    const desc = cat
      ? `${cat.description} Fichas sin precios ni estrellas: solo nombre, descripción y foto real del producto.`
      : "Explora el catálogo completo de RoomFindsClub: mesas, sillas, monitores, teclados, sonido, iluminación y accesorios.";
    document.title = title;
    document.getElementById("page-desc").setAttribute("content", desc);
    document.getElementById("page-canonical").setAttribute(
      "href",
      cat ? `https://roomfindsclub.com/catalogo.html?cat=${cat.slug}` : "https://roomfindsclub.com/catalogo.html"
    );
    document.getElementById("cat-heading").textContent = cat ? cat.name : "Catálogo completo";
    document.getElementById("cat-description").textContent = cat
      ? cat.description
      : "Todas las categorías del setup en un mismo sitio.";
  }

  (async function init() {
    renderFilters();
    const cat = activeCat ? getCategory(activeCat) : null;
    updateHeadMeta(cat);

    const products = await loadProducts();
    const filtered = cat ? products.filter((p) => p.category === cat.slug) : products;

    const grid = document.getElementById("product-grid");
    const empty = document.getElementById("empty-state");

    if (filtered.length === 0) {
      grid.style.display = "none";
      empty.style.display = "block";
    } else {
      grid.innerHTML = filtered.map(productCard).join("");
      bindFavButtons(grid);
    }

    document.getElementById("ld-itemlist").textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": cat ? cat.name : "Catálogo RoomFindsClub",
      "itemListElement": filtered.map((p, i) => ({
        "@type": "ListItem",
        "position": i + 1,
        "url": `https://roomfindsclub.com/producto.html?id=${p.id}`,
        "name": p.name
      }))
    });
  })();
</script>
</body>
</html>
